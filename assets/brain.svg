    <rect width="720" height="430" fill="url(#bg)"/><rect width="720" height="430" fill="url(#grid)"/>
    <g font-family="Arial,sans-serif" fill="#c6d3df"><text x="40" y="43" font-size="12" letter-spacing="3">NEURAL DECODING / PIPELINE</text><path d="M48 114L76 114L83 102L89 128L98 95L106 121L116 114H151" fill="none" stroke="#73e0cc" stroke-opacity="1.0" stroke-width="2"/><path d="M48 149L76 149L83 137L89 163L98 130L106 156L116 149H151" fill="none" stroke="#73e0cc" stroke-opacity="0.88" stroke-width="2"/><path d="M48 184L76 184L83 172L89 198L98 165L106 191L116 184H151" fill="none" stroke="#73e0cc" stroke-opacity="0.76" stroke-width="2"/><path d="M48 219L76 219L83 207L89 233L98 200L106 226L116 219H151" fill="none" stroke="#73e0cc" stroke-opacity="0.64" stroke-width="2"/><path d="M48 254L76 254L83 242L89 268L98 235L106 261L116 254H151" fill="none" stroke="#73e0cc" stroke-opacity="0.52" stroke-width="2"/><path d="M161 184H210M402 184H457" fill="none" stroke="#648099" stroke-width="2"/><rect x="210" y="115" width="192" height="138" rx="12" fill="#18324b" stroke="#608eaf"/><text x="306" y="171" font-size="25" text-anchor="middle" fill="#eef4fa">GRU + CTC</text><text x="306" y="205" font-size="14" text-anchor="middle">Neural → phoneme</text><rect x="457" y="140" width="215" height="88" rx="9" fill="#123936" stroke="#5abfae"/><text x="564" y="178" font-size="20" text-anchor="middle" fill="#9aebd9">Language decoding</text><text x="564" y="204" font-size="13" text-anchor="middle">WFST + language model</text><text x="48" y="350" font-size="29" fill="#eef4fa">Measure the whole pipeline.</text><text x="48" y="382" font-size="15" fill="#8ca6ba">Phoneme gains do not guarantee word-level gains.</text></g></svg>